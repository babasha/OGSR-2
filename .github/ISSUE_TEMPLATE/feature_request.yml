name: Предложение / Feature request
description: Идея новой возможности или улучшения
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу решает / Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предложение / Proposal
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы / Alternatives
